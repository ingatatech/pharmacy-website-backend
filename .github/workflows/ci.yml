name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    # Pinned rather than "latest": the ubuntu-latest label migrates to
    # Ubuntu 26 on 2026-10-19, which would change the base image (and so the
    # Node/glibc builds this suite runs against) without any commit here.
    runs-on: ubuntu-24.04

    # A real, throwaway Postgres for the test suite — it only exists for the
    # lifetime of this job and is never the development or production database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ingata_pharmacy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # No .env.test file exists in CI (it's gitignored) — these are read
      # directly from process.env instead, which tests/global-setup.ts and
      # src/db/data-source.ts both already fall back to.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ingata_pharmacy_test?schema=public
      JWT_SECRET: ci-test-only-jwt-secret-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
